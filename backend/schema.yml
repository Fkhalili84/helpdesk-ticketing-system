openapi: 3.0.3
info:
  title: Helpdesk Ticketing System API
  version: 1.0.0
  description: REST API for a multi-tenant helpdesk ticketing system.
paths:
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Checks whether the backend service is running.
      summary: Health check
      tags:
      - System
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/invitations/{token}/:
    get:
      operationId: invitations_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitation'
          description: ''
  /api/invitations/{token}/accept/:
    post:
      operationId: invitations_accept_create
      description: Accepts a valid organization invitation for the authenticated user.
      summary: Accept organization invitation
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Organizations
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/organizations/{organization_slug}/:
    get:
      operationId: organizations_retrieve
      description: Returns organization information and organization statistics. The
        authenticated user must be an active member.
      summary: Get organization details
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
          description: ''
    patch:
      operationId: organizations_partial_update
      description: Updates organization settings. Only active organization admins
        can perform this operation.
      summary: Update organization
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
          description: ''
  /api/organizations/{organization_slug}/attachments/{attachment_id}/download/:
    get:
      operationId: organizations_attachments_download_retrieve
      description: Securely downloads a ticket attachment after organization and ticket
        permission checks.
      summary: Download ticket attachment
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Attachment file
  /api/organizations/{organization_slug}/dashboard/agents/:
    get:
      operationId: organizations_dashboard_agents_list
      description: Returns assigned and resolved ticket counts for active agents in
        the selected organization. Only organization admins and agents can access
        this endpoint.
      summary: Get agent performance statistics
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardAgentPerformanceResponse'
          description: ''
  /api/organizations/{organization_slug}/dashboard/priorities/:
    get:
      operationId: organizations_dashboard_priorities_retrieve
      description: Returns ticket counts grouped by priority for the selected organization.
      summary: Get ticket priority statistics
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPriorityResponse'
          description: ''
  /api/organizations/{organization_slug}/dashboard/resolution/:
    get:
      operationId: organizations_dashboard_resolution_retrieve
      description: Returns the number of resolved tickets and the average ticket resolution
        time in hours. Closed tickets with a resolution timestamp are also included.
      summary: Get resolution metrics
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResolutionMetricsResponse'
          description: ''
  /api/organizations/{organization_slug}/dashboard/sla/:
    get:
      operationId: organizations_dashboard_sla_retrieve
      description: Returns SLA compliance statistics including tickets within SLA,
        breached tickets, overall compliance percentage, and statistics grouped by
        ticket priority. Only organization admins and agents can access this endpoint.
      summary: Get SLA statistics
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSLAResponse'
          description: ''
  /api/organizations/{organization_slug}/dashboard/summary/:
    get:
      operationId: organizations_dashboard_summary_retrieve
      description: Returns the total number of tickets and ticket counts grouped by
        status for the selected organization.
      summary: Get dashboard summary
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
          description: ''
  /api/organizations/{organization_slug}/invitations/:
    get:
      operationId: organizations_invitations_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationInvitationList'
          description: ''
    post:
      operationId: organizations_invitations_create
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitation'
          description: ''
  /api/organizations/{organization_slug}/members/:
    get:
      operationId: organizations_members_list
      description: Returns members of the selected organization. Only an active organization
        admin can access this endpoint.
      summary: List organization members
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationMemberList'
          description: ''
  /api/organizations/{organization_slug}/members/{membership_id}/:
    get:
      operationId: organizations_members_retrieve
      description: Returns details for one organization membership.
      summary: Get organization member
      parameters:
      - in: path
        name: membership_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: ''
    patch:
      operationId: organizations_members_partial_update
      description: Changes the role or active state of an organization member. The
        last active admin cannot be deactivated or demoted.
      summary: Update organization member
      parameters:
      - in: path
        name: membership_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMemberUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMemberUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMemberUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: ''
    delete:
      operationId: organizations_members_destroy
      description: Removes an organization membership without deleting the underlying
        user account. The last active admin cannot be removed.
      summary: Remove organization member
      parameters:
      - in: path
        name: membership_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Members
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/organizations/{organization_slug}/notifications/:
    get:
      operationId: organizations_notifications_list
      description: Returns notifications belonging to the authenticated user in the
        selected organization.
      summary: List notifications
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - in: query
        name: notification_type
        schema:
          type: string
          enum:
          - new_message
          - status_changed
          - ticket_assigned
        description: |-
          * `ticket_assigned` - Ticket Assigned
          * `status_changed` - Status Changed
          * `new_message` - New Message
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/organizations/{organization_slug}/notifications/{notification_id}/read/:
    patch:
      operationId: organizations_notifications_read_partial_update
      description: Marks one notification belonging to the authenticated user as read.
      summary: Mark notification as read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/organizations/{organization_slug}/notifications/read-all/:
    post:
      operationId: organizations_notifications_read_all_create
      description: Marks all unread notifications belonging to the authenticated user
        as read.
      summary: Mark all notifications as read
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
          description: ''
  /api/organizations/{organization_slug}/notifications/unread-count/:
    get:
      operationId: organizations_notifications_unread_count_retrieve
      description: Returns the number of unread notifications for the authenticated
        user.
      summary: Get unread notification count
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountResponse'
          description: ''
  /api/organizations/{organization_slug}/register/:
    post:
      operationId: organizations_register_create
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRegister'
          description: ''
  /api/organizations/{organization_slug}/ticket-categories/:
    get:
      operationId: organizations_ticket_categories_list
      summary: List ticket categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketCategoryList'
          description: ''
  /api/organizations/{organization_slug}/ticket-categories/{id}/:
    get:
      operationId: organizations_ticket_categories_retrieve
      summary: Get ticket category
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCategory'
          description: ''
  /api/organizations/{organization_slug}/tickets/:
    get:
      operationId: organizations_tickets_list
      description: Returns tickets visible to the authenticated user in the selected
        organization. Customers only see their own tickets.
      summary: List tickets
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketList'
          description: ''
    post:
      operationId: organizations_tickets_create
      description: Creates a ticket for an authenticated customer in the selected
        organization.
      summary: Create ticket
      parameters:
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
  /api/organizations/{organization_slug}/tickets/{id}/:
    get:
      operationId: organizations_tickets_retrieve
      summary: Get ticket
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
    put:
      operationId: organizations_tickets_update
      summary: Update ticket
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
    patch:
      operationId: organizations_tickets_partial_update
      summary: Partially update ticket
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTicketRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
    delete:
      operationId: organizations_tickets_destroy
      description: Deletes a ticket. Only an organization admin can perform this operation.
      summary: Delete ticket
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/organizations/{organization_slug}/tickets/{ticket_id}/attachments/:
    get:
      operationId: organizations_tickets_attachments_list
      description: Returns attachments belonging to a ticket.
      summary: List ticket attachments
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: organization_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: ticket_id
        schema:
          type: integer
        required: true
      tags:
      - Tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
