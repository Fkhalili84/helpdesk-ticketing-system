name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  backend-tests:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: helpdesk
          POSTGRES_USER: helpdesk_user
          POSTGRES_PASSWORD: ci_postgres_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U helpdesk_user -d helpdesk"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

      DJANGO_SECRET_KEY: ci-only-django-secret-key-1234567890-abcdef
      DJANGO_DEBUG: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Django system check
        run: |
          python manage.py check

      - name: Check missing migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput

      - name: Run backend tests
        run: |
          python manage.py test

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular --file schema-ci.yml --validate


  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest

    needs:
      - backend-tests

    env:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: ci_postgres_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build and start containers
        run: |
          docker compose up -d --build

      - name: Wait for backend
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/schema/ \
              > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend did not become ready."
          docker compose logs
          exit 1

      - name: Show container status
        run: |
          docker compose ps

      - name: Django check inside container
        run: |
          docker compose exec -T backend python manage.py check

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v